<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter</title><style>
:root{font-family:system-ui,Roboto,sans-serif;color:#eaf1fc;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px 18px;background:radial-gradient(ellipse at 100% 0,#193454,#0b1120 65%)}main{max-width:560px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.22em;color:#72d0ec;text-transform:uppercase;font-weight:750}h1{font-size:30px;letter-spacing:-.04em;margin:8px 0 10px}.description{color:#a8b9d0;font-size:14px;line-height:1.55;margin:0 0 24px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{padding:17px;border:1px solid #2b405b;background:#17263d;border-radius:18px}.label{font-size:12px;color:#adc0da}.value{font-size:32px;letter-spacing:-.035em;font-weight:750;margin-top:8px;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:9px;margin-bottom:16px}button{flex:1;border:0;border-radius:12px;min-height:47px;font-size:14px;font-weight:700;color:white;background:#2b405b}button.primary{background:#39b8e0;color:#061727}button:active{opacity:.75}.editor-label{display:flex;justify-content:space-between;color:#b9cbe2;font-size:13px;margin-bottom:9px}textarea{display:block;width:100%;height:38dvh;min-height:230px;padding:16px;border:1px solid #31465d;border-radius:18px;background:#101e32;color:#f7fafc;font:16px/1.6 system-ui,Roboto,sans-serif;resize:vertical;outline:none}textarea:focus{border-color:#39b8e0}#status{min-height:20px;margin-top:12px;color:#91a9c3;font-size:12px}@media(max-width:350px){h1{font-size:25px}.value{font-size:27px}.toolbar{gap:6px}button{font-size:12px}}
</style></head><body><main><div class="eyebrow">Writing utility</div><h1>Word Counter</h1><p class="description">Paste or type text to see accurate live counts for characters, words and lines. Designed for captions, messages and writing with limits. Works entirely offline.</p>
<section class="stats" aria-label="Live statistics"><div class="stat"><div class="label">Characters</div><div class="value" id="chars">0</div></div><div class="stat"><div class="label">Without whitespace</div><div class="value" id="nospace">0</div></div><div class="stat"><div class="label">Words</div><div class="value" id="words">0</div></div><div class="stat"><div class="label">Lines</div><div class="value" id="lines">0</div></div></section>
<div class="toolbar"><button class="primary" id="paste">Paste</button><button id="copy">Copy</button><button id="clear">Clear</button></div>
<label class="editor-label" for="text"><span>Your text</span><span id="length">0 characters</span></label><textarea id="text" placeholder="Type or paste your text here…" spellcheck="true"></textarea><div id="status" role="status" aria-live="polite">Ready</div></main>
<script>
const el=id=>document.getElementById(id),field=el('text');
function update(){const text=field.value,normalized=text.replace(/\r\n?/g,'\n'),segments=normalized.trim().match(/[^\s]+/gu);
el('chars').textContent=Array.from(text).length.toLocaleString();
el('nospace').textContent=Array.from(text.replace(/\s/gu,'')).length.toLocaleString();
el('words').textContent=(segments?segments.length:0).toLocaleString();
el('lines').textContent=(normalized.length?normalized.split('\n').length:0).toLocaleString();
el('length').textContent=Array.from(text).length.toLocaleString()+' characters';}
field.addEventListener('input',update);
el('paste').addEventListener('click',async()=>{try{const value=window.AndroidClipboard?AndroidClipboard.read():await navigator.clipboard.readText();field.value=value;update();el('status').textContent='Pasted from clipboard';}catch(e){el('status').textContent='Tap and hold inside the editor to paste.';}});
el('copy').addEventListener('click',async()=>{try{if(window.AndroidClipboard)AndroidClipboard.write(field.value);else await navigator.clipboard.writeText(field.value);el('status').textContent='Copied';}catch(e){el('status').textContent='Copy unavailable';}});
el('clear').addEventListener('click',()=>{field.value='';update();el('status').textContent='Cleared';field.focus();});
update();
</script></body></html>
